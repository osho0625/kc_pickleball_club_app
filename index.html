<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="関東地区ピックル会の練習日程・出欠管理アプリ" />
  <link rel="manifest" href="manifest.json" />
  <title>関東地区ピックル会｜練習日管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="app-header" role="banner">
      <h1 class="app-title">関東地区ピックル会</h1>
      <p class="app-subtitle">練習日程・出欠管理</p>
    </header>

    <!-- エラー / オフラインバナー -->
    <div id="error-banner" class="error-banner" role="alert" aria-live="polite" style="display:none;"></div>

    <!-- ローディングスピナー -->
    <div id="loading-spinner" class="loading-spinner" role="status" aria-label="読み込み中" style="display:none;">
      <div class="spinner" aria-hidden="true"></div>
      <span class="sr-only">読み込み中...</span>
    </div>

    <!-- メンバー選択画面 -->
    <main id="screen-member-select" class="screen" role="main" aria-label="メンバー選択画面" style="display:none;">
    </main>

    <!-- メイン画面（セッション一覧） -->
    <main id="screen-main" class="screen" role="main" aria-label="練習日一覧画面" style="display:none;">
    </main>

    <!-- フォーム画面（追加/編集） -->
    <section id="screen-form" class="screen" role="region" aria-label="練習日フォーム" style="display:none;">
    </section>

    <!-- 設定画面 -->
    <section id="screen-settings" class="screen" role="region" aria-label="設定" style="display:none;">
    </section>
  </div>

  <!-- Scripts (ES Modules) -->
  <script type="module" src="common.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

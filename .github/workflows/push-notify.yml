name: Push Notification Delivery

on:
  schedule:
    # 毎日 JST 7:55, 8:00, 8:05 (UTC 22:55, 23:00, 23:05 前日) と
    # JST 17:25, 17:30, 17:35 (UTC 8:25, 8:30, 8:35)
    - cron: '55 22 * * *'
    - cron: '0 23 * * *'
    - cron: '5 23 * * *'
    - cron: '25 8 * * *'
    - cron: '30 8 * * *'
    - cron: '35 8 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Process and deliver push messages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
        run: node scripts/push-notify.js
